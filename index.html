          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true
            });
          }
        } catch (e) {
          // Silent catch to prevent errors in non-configurable environments
        }
      })();
    </script>
